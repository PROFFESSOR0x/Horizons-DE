# Horizons Hyprland config — legacy hyprlang entry point.
#
# WHO LOADS THIS FILE?
# - Hyprland < 0.55 (e.g. Ubuntu archive builds without the Lua update) loads
#   THIS file (hyprland.conf) and ignores hyprland.lua.
# - Hyprland >= 0.55 loads hyprland.lua INSTEAD and ignores this file.
# Ship both: every machine picks the syntax its Hyprland understands.
#
# Mirror of hyprland.lua — keep both entry points in sync.
# You wanna add your stuff in files in `custom` (see custom/*.conf).

# --- Environment variables ---
source = hyprland/env.conf
# hyprlang noerror true
source = custom/env.conf
# hyprlang noerror false

# --- Other vars ($terminal, $browser, ... + $qsScripts helpers) ---
source = hyprland/variables.conf
# hyprlang noerror true
source = custom/variables.conf
# hyprlang noerror false

# --- Defaults ---
source = hyprland/execs.conf
source = hyprland/general.conf
source = hyprland/rules.conf
source = hyprland/colors.conf
source = hyprland/keybinds.conf

# --- Custom (user overrides; never overwritten by updates) ---
# hyprlang noerror true
source = custom/execs.conf
# hyprlang noerror true
source = custom/general.conf
# hyprlang noerror true
source = custom/rules.conf
# hyprlang noerror true
source = custom/keybinds.conf
# hyprlang noerror false

# --- nwg-displays support ---
source = workspaces.conf
source = monitors.conf

# --- Shell overrides (sourced last so they win, like hyprland.lua does) ---
source = hyprland/shellOverrides/main.conf
source = hyprland/shellOverrides/animations.conf
