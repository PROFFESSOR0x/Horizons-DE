# This file is to be overwritten by nwg-displays if you choose to use it.
# nwg-displays is a graphical tool for managing monitors.
# - Installation for Arch Linux: sudo pacman -S nwg-displays
# - Repo: https://github.com/nwg-piotr/nwg-displays
#
# Legacy (.conf) monitors — mirror of monitors.lua (Hyprland < 0.55).
# Hyprland >= 0.55 loads monitors.lua instead and ignores these lines.
# Delete or edit the two lines below if they don't match your hardware
# (`hyprctl monitors` shows device names); the wildcard in
# hyprland/general.conf (`monitor = , preferred, auto, 1`) is the fallback.
monitor = eDP-1, 1920x1080@60.01Hz, 0x0, 1.25
monitor = HDMI-A-1, 1920x1080@60.00Hz, 1536x0, 1
