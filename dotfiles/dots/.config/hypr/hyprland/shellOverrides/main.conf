# Legacy hyprlang config for Hyprland < 0.55 (e.g. Ubuntu archive builds),
# which cannot load the Lua (*.lua) config.
# Mirror of hyprland/shellOverrides/main.lua — keep both files in sync.
# DO NOT EDIT THIS FILE. IT IS MANAGED BY THE SHELL AND FOLLOWS STRICT RULES.
# Hyprland >= 0.55 loads hyprland.lua instead and ignores this file.
# Sourced AFTER hyprland/general.conf so these values win.

decoration {
    inactive_opacity = 0.9
    rounding = 22
    rounding_power = 2.5
    blur {
        enabled = true
        size = 1
        passes = 3
        vibrancy = 0.5
        xray = true
        new_optimizations = true
        noise = 0
        contrast = 0
        brightness = 0.6
        vibrancy_darkness = 0
        special = false
        popups = false
        popups_ignorealpha = true
    }
    active_opacity = 1.0
    fullscreen_opacity = 1.0
    dim_inactive = false
    dim_strength = 0.5
    dim_special = 0.2
    border_part_of_window = true
    shadow {
        enabled = true
        range = 20
        render_power = 3
        sharp = false
        color = rgba(00000020)
        offset = 0 2
        scale = 1.0
    }
    dim_modal = true
    dim_around = false
}

master {
    mfact = 0.55
    new_status = slave
    orientation = left
}

general {
    border_size = 1
    gaps_in = 2
    gaps_out = 5
    gaps_workspaces = 0
    layout = dwindle
    resize_on_border = false
    allow_tearing = true
    float_gaps = 0
    extend_border_grab_area = true
    hover_icon_on_border = true
    no_focus_fallback = false
    snap {
        enabled = false
        window_gap = 10
        monitor_gap = 10
        border_overlap = false
        respect_gaps = true
    }
}

animations {
    enabled = true
}

input {
    kb_layout = us,ara
    kb_options = grp:alt_shift_toggle
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 35
    follow_mouse = 1
    sensitivity = 0
    force_no_accel = false
    scroll_factor = 1.0
    scroll_button = 0
    left_handed = false
    touchpad {
        natural_scroll = false
        disable_while_typing = true
        clickfinger_behavior = false
        scroll_factor = 0.7
        tap_to_click = true
        tap_button_map = 0
        tap_and_drag = true
        drag_lock = false
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    allow_session_lock_restore = false
    focus_on_activate = 0
}

cursor {
    zoom_factor = 1.0
    zoom_rigid = false
    hide_on_key_press = false
    hide_on_touch = true
    hotspot_padding = 1
    inactive_timeout = 0
    no_warps = false
    persistent_warps = false
}

gestures {
    workspace_swipe_distance = 700
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_min_speed_to_force = 5
    workspace_swipe_direction_lock = true
    workspace_swipe_direction_lock_threshold = 10
    workspace_swipe_create_new = true
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = false
}

group {
    auto_group = false
    drag_into_group = true
    merge_groups_on_drag = true
    groupbar {
        enabled = true
    }
}
