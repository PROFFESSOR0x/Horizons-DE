# Legacy hyprlang config for Hyprland < 0.55 (e.g. Ubuntu archive builds),
# which cannot load the Lua (*.lua) config.
# Mirror of hyprland/shellOverrides/animations.lua (generated by the Horizons
# animations editor, preset: Smooth / Material standard easing).
# Sourced AFTER hyprland/general.conf so this preset wins over the baked-in
# defaults there — same order as hyprland.lua.
# Hyprland >= 0.55 loads hyprland.lua instead and ignores this file.

bezier = sm_standard, 0.4, 0, 0.2, 1 # Material standard
bezier = sm_decel, 0, 0, 0.2, 1 # Material standard decelerate
bezier = sm_accel, 0.4, 0, 1, 1 # Material standard accelerate
bezier = sm_linear, 0, 0, 1, 1 # for continuous angle loops

animation = global, 1, 10, sm_standard
animation = windows, 1, 4.2, sm_standard
animation = windowsIn, 1, 3.6, sm_decel, popin 85%
animation = windowsOut, 1, 2.6, sm_accel, popin 85%
animation = windowsMove, 1, 4, sm_standard
animation = layers, 1, 3, sm_standard
animation = layersIn, 1, 3, sm_decel, slide
animation = layersOut, 1, 2.4, sm_accel, slide
animation = fade, 1, 3, sm_standard
animation = fadeIn, 1, 3, sm_decel
animation = fadeOut, 1, 2.4, sm_accel
animation = fadeSwitch, 1, 2, sm_standard
animation = fadeShadow, 1, 3, sm_standard
animation = fadeDim, 1, 3, sm_standard
animation = fadeLayersIn, 1, 2.6, sm_decel
animation = fadeLayersOut, 1, 2.2, sm_accel
animation = fadePopups, 1, 2.4, sm_standard
animation = fadePopupsIn, 1, 2.4, sm_decel
animation = fadePopupsOut, 1, 2, sm_accel
animation = fadeDpms, 1, 6, sm_standard
animation = border, 1, 6, sm_standard
animation = borderangle, 0, 30, sm_linear, loop
animation = shadowangle, 0, 30, sm_linear, loop
animation = glowangle, 0, 30, sm_linear, loop
animation = workspaces, 1, 5, sm_standard, slide
animation = workspacesIn, 1, 4.5, sm_decel, slide
animation = workspacesOut, 1, 3.6, sm_accel, slide
animation = specialWorkspace, 1, 4, sm_standard, slidevert
animation = specialWorkspaceIn, 1, 4, sm_decel, slidevert
animation = specialWorkspaceOut, 1, 3, sm_accel, slidevert
animation = zoomFactor, 1, 6, sm_standard
