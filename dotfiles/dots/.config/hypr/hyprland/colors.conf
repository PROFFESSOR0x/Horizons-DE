# Legacy hyprlang config for Hyprland < 0.55 (e.g. Ubuntu archive builds),
# which cannot load the Lua (*.lua) config.
# Mirror of hyprland/colors.lua — keep both files in sync.
# Hyprland >= 0.55 loads hyprland.lua instead and ignores this file.

general {
    col.active_border = rgba(44464f77)
    col.inactive_border = rgba(1a1b2033)
}

misc {
    background_color = rgba(121318FF)
}

# Pinned windows get a distinct border
windowrulev2 = bordercolor rgba(afc6ffAA) rgba(afc6ff77), match:pin 1
