# Legacy hyprlang config for Hyprland < 0.55 (e.g. Ubuntu archive builds),
# which cannot load the Lua (*.lua) config.
# Mirror of hyprland/variables.lua — keep both files in sync.
# Copy overrides to ~/.config/hypr/custom/variables.conf (same $names).
# Hyprland >= 0.55 loads hyprland.lua instead and ignores this file.

# The folder within ~/.config/quickshell containing the config
env = qsConfig, horizons

# Shared helpers (mirrors the locals at the top of hyprland/keybinds.lua)
$qsScripts = $HOME/.config/quickshell/$qsConfig/scripts
$hyprScripts = $HOME/.config/hypr/hyprland/scripts
$qsIpcCall = qs -c $qsConfig ipc call
$qsIsAlive = qs -c $qsConfig ipc call TEST_ALIVE

# Apps
# PULL REQUESTS ADDING MORE WILL NOT BE ACCEPTED, CONFIG FOR YOURSELF
$terminal = $HOME/.config/hypr/hyprland/scripts/launch_first_available.sh 'kitty -1' 'foot' 'alacritty' 'wezterm' 'konsole' 'kgx' 'uxterm' 'xterm'
$fileManager = $HOME/.config/hypr/hyprland/scripts/launch_first_available.sh 'dolphin' 'nautilus' 'nemo' 'thunar' 'kitty -1 fish -c yazi'
$browser = $HOME/.config/hypr/hyprland/scripts/launch_first_available.sh 'firefox' 'google-chrome-stable' 'zen-browser' 'brave' 'chromium' 'microsoft-edge-stable' 'opera' 'librewolf'
$codeEditor = $HOME/.config/hypr/hyprland/scripts/launch_first_available.sh 'windsurf' 'antigravity' 'code' 'codium' 'cursor' 'zed' 'zedit' 'zeditor' 'kate' 'gnome-text-editor' 'emacs' 'command -v nvim && kitty -1 nvim' 'command -v micro && kitty -1 micro'
$officeSoftware = $HOME/.config/hypr/hyprland/scripts/launch_first_available.sh 'wps' 'onlyoffice-desktopeditors' 'libreoffice'
$textEditor = $HOME/.config/hypr/hyprland/scripts/launch_first_available.sh 'kate' 'gnome-text-editor' 'emacs'
$volumeMixer = $HOME/.config/hypr/hyprland/scripts/launch_first_available.sh 'pavucontrol-qt' 'pavucontrol'
$settingsApp = XDG_CURRENT_DESKTOP=gnome $HOME/.config/hypr/hyprland/scripts/launch_first_available.sh 'qs -p $HOME/.config/quickshell/$qsConfig/settings.qml' 'systemsettings' 'gnome-control-center' 'better-control'
$taskManager = $HOME/.config/hypr/hyprland/scripts/launch_first_available.sh 'gnome-system-monitor' 'plasma-systemmonitor --page-name Processes' 'command -v btop && kitty -1 fish -c btop'

# NOTE: variables.lua also defines workspaceGroupSize = 10 for dynamic
# workspace groups (workspace_in_group()). Static hyprlang cannot do that,
# so hyprland/keybinds.conf maps SUPER+1..0 straight to workspaces 1..10.
