# Legacy hyprlang config for Hyprland < 0.55 (e.g. Ubuntu archive builds),
# which cannot load the Lua (*.lua) config.
# Mirror of hyprland/env.lua — keep both files in sync.
# Hyprland >= 0.55 loads hyprland.lua instead and ignores this file.

# Wayland
env = ELECTRON_OZONE_PLATFORM_HINT, auto

# Applications (mirrors env.lua: appends the previous value)
env = XDG_DATA_DIRS, $HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share:$XDG_DATA_DIRS

# Themes
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_QPA_PLATFORMTHEME, kde
env = XDG_MENU_PREFIX, plasma-

# Virtual environment
env = ILLOGICAL_IMPULSE_VIRTUAL_ENV, $HOME/.local/state/quickshell/.venv
