# Legacy hyprlang config for Hyprland < 0.55 (e.g. Ubuntu archive builds),
# which cannot load the Lua (*.lua) config.
# Mirror of hyprland/execs.lua — keep both files in sync.
# Hyprland >= 0.55 loads hyprland.lua instead and ignores this file.

# Bar, wallpaper
exec-once = $HOME/.config/hypr/hyprland/scripts/start_geoclue_agent.sh
exec-once = qs -n -c $qsConfig
exec-once = $HOME/.config/hypr/custom/scripts/__restore_video_wallpaper.sh

# Core components (authentication, lock screen, notification daemon)
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = hypridle
exec-once = dbus-update-activation-environment --all
exec-once = sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # Some fix idk

# Audio
exec-once = easyeffects --hide-window --service-mode

# Clipboard: history
#exec-once = wl-paste --watch cliphist store
exec-once = wl-paste --type text --watch bash -c 'cliphist store && qs -c $qsConfig ipc call cliphistService update'
exec-once = wl-paste --type image --watch bash -c 'cliphist store && qs -c $qsConfig ipc call cliphistService update'

# Cursor
exec-once = hyprctl setcursor Bibata-Modern-Classic 24
