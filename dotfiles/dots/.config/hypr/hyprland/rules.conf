# Legacy hyprlang config for Hyprland < 0.55 (e.g. Ubuntu archive builds),
# which cannot load the Lua (*.lua) config.
# Mirror of hyprland/rules.lua — keep both files in sync.
# Hyprland >= 0.55 loads hyprland.lua instead and ignores this file.
# NOTE: `windowrulev2` below is intentional (builds < 0.53 need it). On
# Hyprland >= 0.53 the installer rewrites the INSTALLED copies to the
# unified `windowrule` keyword — do not "fix" it here by hand.

######## Window rules ########

# Disable blur for xwayland context menus (real glitch workaround, not a
# shell-scoping rule — unnamed X11 popups render blur as a glitchy black box)
windowrulev2 = noblur on, match:class ^()$ match:title ^()$

# (Blanket "noblur" for every window removed — blur/glass is meant to
# apply to any window, not just shell panels. Per-window opt-out is still
# available via Settings > Hyprland > Window Rules > "No Blur".)

# Floating
windowrulev2 = center on, match:title ^(Open File)(.*)$
windowrulev2 = float on, match:title ^(Open File)(.*)$
windowrulev2 = center on, match:title ^(Select a File)(.*)$
windowrulev2 = float on, match:title ^(Select a File)(.*)$
windowrulev2 = center on, match:title ^(Choose wallpaper)(.*)$
windowrulev2 = float on, match:title ^(Choose wallpaper)(.*)$
windowrulev2 = size 60% 65%, match:title ^(Choose wallpaper)(.*)$
windowrulev2 = center on, match:title ^(Open Folder)(.*)$
windowrulev2 = float on, match:title ^(Open Folder)(.*)$
windowrulev2 = center on, match:title ^(Save As)(.*)$
windowrulev2 = float on, match:title ^(Save As)(.*)$
windowrulev2 = center on, match:title ^(Library)(.*)$
windowrulev2 = float on, match:title ^(Library)(.*)$
windowrulev2 = center on, match:title ^(File Upload)(.*)$
windowrulev2 = float on, match:title ^(File Upload)(.*)$
windowrulev2 = center on, match:title ^(.*)(wants to save)$
windowrulev2 = float on, match:title ^(.*)(wants to save)$
windowrulev2 = center on, match:title ^(.*)(wants to open)$
windowrulev2 = float on, match:title ^(.*)(wants to open)$
windowrulev2 = float on, match:class ^(blueberry\.py)$
windowrulev2 = float on, match:class ^(guifetch)$ # FlafyDev/guifetch
windowrulev2 = float on, match:class ^(pavucontrol)$
windowrulev2 = size 45% 45%, match:class ^(pavucontrol)$
windowrulev2 = center on, match:class ^(pavucontrol)$
windowrulev2 = float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrulev2 = size 45% 45%, match:class ^(org.pulseaudio.pavucontrol)$
windowrulev2 = center on, match:class ^(org.pulseaudio.pavucontrol)$
windowrulev2 = float on, match:class ^(nm-connection-editor)$
windowrulev2 = size 45% 45%, match:class ^(nm-connection-editor)$
windowrulev2 = center on, match:class ^(nm-connection-editor)$
windowrulev2 = float on, match:class .*plasmawindowed.*
windowrulev2 = float on, match:class kcm_.*
windowrulev2 = float on, match:class .*bluedevilwizard
windowrulev2 = float on, match:title .*Welcome
windowrulev2 = float on, match:title ^(illogical-impulse Settings)$
windowrulev2 = float on, match:title .*Shell conflicts.*
windowrulev2 = float on, match:class org.freedesktop.impl.portal.desktop.kde
windowrulev2 = size 60% 65%, match:class org.freedesktop.impl.portal.desktop.kde
windowrulev2 = float on, match:class ^(Zotero)$
windowrulev2 = size 45% 45%, match:class ^(Zotero)$

# Move
# kde-material-you-colors spawns a window when changing dark/light theme. This is to make sure it doesn't interfere at all.
windowrulev2 = float on, match:class ^(plasma-changeicons)$
windowrulev2 = no_initial_focus on, match:class ^(plasma-changeicons)$
windowrulev2 = move 999999 999999, match:class ^(plasma-changeicons)$
# stupid dolphin copy
windowrulev2 = move 40 80, match:title ^(Copying — Dolphin)$

# Tiling
windowrulev2 = tile on, match:class ^dev\.warp\.Warp$

# Picture-in-Picture
windowrulev2 = float on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrulev2 = keep_aspect_ratio on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrulev2 = move 73% 72%, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrulev2 = size 25% 25%, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrulev2 = float on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrulev2 = pin on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

# Screen sharing
windowrulev2 = float on, match:title .*is sharing (a window|your screen).*
windowrulev2 = pin on, match:title .*is sharing (a window|your screen).*
windowrulev2 = move 50% 100%-12, match:title .*is sharing (a window|your screen).*

# --- Tearing ---
windowrulev2 = immediate on, match:title .*\.exe
windowrulev2 = immediate on, match:title .*minecraft.*
windowrulev2 = immediate on, match:class ^(steam_app).*

# No shadow for tiled windows
windowrulev2 = noshadow on, match:float 0

######## Workspace rules ########
workspace = special:special, gapsout:30

######## Layer rules ########
layerrule = xray on, .*
layerrule = no_anim on, walker
layerrule = no_anim on, selection
layerrule = no_anim on, overview
layerrule = no_anim on, anyrun
layerrule = no_anim on, indicator.*
layerrule = no_anim on, osk
layerrule = no_anim on, hyprpicker

layerrule = no_anim on, noanim
layerrule = blur on, gtk-layer-shell
layerrule = ignore_alpha 0, gtk-layer-shell
layerrule = blur on, launcher
layerrule = ignore_alpha 0.5, launcher
layerrule = blur on, notifications
layerrule = ignore_alpha 0.69, notifications
layerrule = blur on, logout_dialog # wlogout

# ags
layerrule = animation slide left, sideleft.*
layerrule = animation slide right, sideright.*
layerrule = blur on, session[0-9]*
layerrule = blur on, bar[0-9]*
layerrule = ignore_alpha 0.6, bar[0-9]*
layerrule = blur on, barcorner.*
layerrule = ignore_alpha 0.6, barcorner.*
layerrule = blur on, dock[0-9]*
layerrule = ignore_alpha 0.6, dock[0-9]*
layerrule = blur on, indicator.*
layerrule = ignore_alpha 0.6, indicator.*
layerrule = blur on, overview[0-9]*
layerrule = ignore_alpha 0.6, overview[0-9]*
layerrule = blur on, cheatsheet[0-9]*
layerrule = ignore_alpha 0.6, cheatsheet[0-9]*
layerrule = blur on, sideright[0-9]*
layerrule = ignore_alpha 0.6, sideright[0-9]*
layerrule = blur on, sideleft[0-9]*
layerrule = ignore_alpha 0.6, sideleft[0-9]*
layerrule = blur on, indicator.*
layerrule = ignore_alpha 0.6, indicator.*
layerrule = blur on, osk[0-9]*
layerrule = ignore_alpha 0.6, osk[0-9]*

# Quickshell
# Quickshell: illogical-impulse
layerrule = blur_popups on, quickshell:.*
layerrule = blur on, quickshell:.*
layerrule = ignore_alpha 0.79, quickshell:.*
layerrule = animation slide, quickshell:bar
layerrule = no_anim on, quickshell:actionCenter
layerrule = animation slide bottom, quickshell:cheatsheet
layerrule = animation slide bottom, quickshell:dock
layerrule = animation popin 120%, quickshell:screenCorners
layerrule = no_anim on, quickshell:lockWindowPusher
layerrule = animation fade, quickshell:notificationPopup
layerrule = no_anim on, quickshell:overlay
layerrule = ignore_alpha 1, quickshell:overlay
layerrule = no_anim on, quickshell:overview
layerrule = animation slide bottom, quickshell:osk
layerrule = no_anim on, quickshell:polkit
layerrule = xray off, quickshell:popup # No weird color for bar tooltips (this in theory should suffice)
layerrule = ignore_alpha 1, quickshell:popup # No weird color for bar tooltips (but somehow this is necessary)
layerrule = ignore_alpha 1, quickshell:mediaControls # Same as above
layerrule = animation slide, quickshell:reloadPopup
layerrule = no_anim on, quickshell:regionSelector
layerrule = no_anim on, quickshell:screenshot
layerrule = blur on, quickshell:session
layerrule = no_anim on, quickshell:session
layerrule = ignore_alpha 0, quickshell:session
layerrule = animation slide right, quickshell:sidebarRight
layerrule = animation slide left, quickshell:sidebarLeft
layerrule = animation slide, quickshell:verticalBar
layerrule = order -1, quickshell:osk
# Quickshell: waffles
layerrule = animation slide top, quickshell:wallpaperSelector
layerrule = no_anim on, quickshell:wNotificationCenter
layerrule = no_anim on, quickshell:wOnScreenDisplay
layerrule = no_anim on, quickshell:wStartMenu
layerrule = ignore_alpha 0, quickshell:wTaskView
layerrule = no_anim on, quickshell:wTaskView

# Launchers need to be FAST
layerrule = no_anim on, gtk4-layer-shell
