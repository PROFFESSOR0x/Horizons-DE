# Legacy hyprlang config for Hyprland < 0.55 (e.g. Ubuntu archive builds),
# which cannot load the Lua (*.lua) config.
# Mirror of hyprland/keybinds.lua — keep both files in sync.
# Hyprland >= 0.55 loads hyprland.lua instead and ignores this file.
#
# Uses $vars from hyprland/variables.conf (sourced before this file):
#   $qsScripts $hyprScripts $qsIpcCall $qsIsAlive
#   $terminal $fileManager $browser $codeEditor $officeSoftware
#   $textEditor $volumeMixer $taskManager
# Trailing "# ..." comments are cheatsheet descriptions (mirrors the
# `{ description = ... }` annotations in keybinds.lua).
#
# KNOWN LEGACY LIMITS (need the Lua config, i.e. Hyprland >= 0.55):
# - Dynamic workspace groups (workspace_in_group, group size 10): binds below
#   map SUPER+1..0 straight to workspaces 1..10.
# - Unified multi-monitor workspaces (~/.config/horizons/config.json
#   "unifiedMultiMonitor"): falls back to plain relative workspaces below.
# - Screen zoom uses hyprland/scripts/zoom.sh (same ±0.3 step, clamped 1.0–3.0).
# - SUPER+ALT+F11/F12 test notifications use hyprland/scripts/test-notify.sh
#   (hyprlang would otherwise expand their shell $vars at parse time).

$mediaNext = playerctl next || playerctl position `bc <<< "100 * $(playerctl metadata mpris:length) / 1000000 / 100"`
$grimMonitor = grim -o "$(hyprctl activeworkspace -j | jq -r '.monitor')"

bind = SUPER, SUPER_L, global, quickshell:searchToggleRelease # Shell: Toggle search
bind = SUPER, SUPER_R, global, quickshell:searchToggleRelease
bind = SUPER, SUPER_L, exec, $qsIsAlive || pkill fuzzel || fuzzel
bind = SUPER, SUPER_R, exec, $qsIsAlive || pkill fuzzel || fuzzel

bindit = , SUPER_L, global, quickshell:workspaceNumber
bindit = , SUPER_R, global, quickshell:workspaceNumber
bindirt = , SUPER_L, global, quickshell:workspaceNumber
bindirt = , SUPER_R, global, quickshell:workspaceNumber
bind = SUPER, Tab, global, quickshell:overviewWorkspacesToggle # Shell: Toggle overview
# Quick, mouse-free focus switching (no visual UI — that's Super+Tab above).
bind = ALT, Tab, cyclenext # Window: Cycle focus to next window
bind = ALT, Tab, bringactivetotop
bind = SUPER, V, global, quickshell:overviewClipboardToggle
bind = SUPER, period, global, quickshell:overviewEmojiToggle
bind = SUPER, A, global, quickshell:sidebarLeftToggle # Shell: Toggle left sidebar
bind = SUPER ALT, A, global, quickshell:sidebarLeftToggleDetach
bind = SUPER, B, global, quickshell:sidebarLeftToggle
bind = SUPER, O, global, quickshell:sidebarLeftToggle
bind = SUPER, N, global, quickshell:sidebarRightToggle # Shell: Toggle right sidebar
bind = SUPER, slash, global, quickshell:cheatsheetToggle # Shell: Toggle cheatsheet
bind = SUPER, K, global, quickshell:oskToggle # Shell: Toggle on-screen keyboard
bind = SUPER, M, global, quickshell:mediaControlsToggle # Shell: Toggle media controls
bind = SUPER, G, global, quickshell:overlayToggle # Shell: Toggle widget overlay
bind = CTRL ALT, Delete, global, quickshell:sessionToggle # Shell: Toggle session menu
bind = SUPER, J, global, quickshell:barToggle # Shell: Toggle bar
bind = CTRL ALT, Delete, exec, $qsIsAlive || pkill wlogout || wlogout -p layer-shell
bind = SHIFT SUPER ALT, slash, exec, qs -p $HOME/.config/quickshell/$qsConfig/welcome.qml

bindel = , XF86MonBrightnessUp, exec, $qsIpcCall brightness increment || brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, $qsIpcCall brightness decrement || brightnessctl s 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1.5
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-

bind = CTRL SUPER, T, global, quickshell:wallpaperSelectorToggle # Shell: Change wallpaper
bind = CTRL SUPER ALT, T, global, quickshell:wallpaperSelectorRandom # Shell: Random wallpaper
bind = CTRL SUPER SHIFT, D, global, quickshell:toggleLightDark # Shell: Toggle light/dark mode
bind = CTRL SUPER, T, exec, $qsIsAlive || $qsScripts/colors/switchwall.sh
bind = CTRL SUPER, R, exec, killall ydotool qs quickshell; qs -c $qsConfig & # Shell: Restart widgets
bind = CTRL SUPER, P, global, quickshell:panelFamilyCycle # Shell: Cycle panel family

##! Utilities
# Screenshot, Record, OCR, Color picker, Clipboard history
bind = SUPER, V, exec, $qsIsAlive || pkill fuzzel || cliphist list | fuzzel --match-mode fzf --dmenu | cliphist decode | wl-copy # Utilities: Clipboard history >> clipboard
bind = SUPER, period, exec, $qsIsAlive || pkill fuzzel || $hyprScripts/fuzzel-emoji.sh copy # Utilities: Emoji >> clipboard
bind = SUPER SHIFT, S, global, quickshell:regionScreenshot # Utilities: Screen snip
bind = SUPER SHIFT, S, exec, $qsIsAlive || pidof slurp || hyprshot --freeze --clipboard-only --mode region --silent
bind = SUPER SHIFT, A, global, quickshell:regionSearch # Utilities: Google Lens
bind = SUPER SHIFT, A, exec, $qsIsAlive || pidof slurp || $hyprScripts/snip_to_search.sh
# OCR
bind = SUPER SHIFT, X, global, quickshell:regionOcr # Utilities: Character recognition >> clipboard
bind = SUPER SHIFT, T, global, quickshell:screenTranslate # Utilities: Translate screen content
bind = SUPER SHIFT, X, exec, $qsIsAlive || pidof slurp || grim -g "$(slurp)" "/tmp/ocr_image.png" && tesseract "/tmp/ocr_image.png" stdout -l $(tesseract --list-langs | awk 'NR>1{print $1}' | tr '\n' '+' | sed 's/\+$//') | wl-copy && rm "/tmp/ocr_image.png"
# Color picker
bind = SUPER SHIFT, C, exec, hyprpicker -a # Utilities: Pick color #RRGGBB >> clipboard
# Recording stuff
bindl = SUPER SHIFT, R, global, quickshell:regionRecord # Utilities: Record region (no sound)
bindl = SUPER SHIFT, R, exec, $qsIsAlive || $qsScripts/videos/record.sh
bindl = SUPER ALT, R, global, quickshell:regionRecord
bindl = SUPER ALT, R, exec, $qsIsAlive || $qsScripts/videos/record.sh
bindl = CTRL ALT, R, exec, $qsScripts/videos/record.sh --fullscreen
bindl = SUPER SHIFT ALT, R, exec, $qsScripts/videos/record.sh --fullscreen --sound # Utilities: Record screen (with sound)
# Fullscreen screenshot
bindl = , Print, exec, $grimMonitor - | wl-copy # Utilities: Screenshot >> clipboard
bindn = CTRL, Print, exec, mkdir -p $(xdg-user-dir PICTURES)/Screenshots && $grimMonitor $(xdg-user-dir PICTURES)/Screenshots/Screenshot_"$(date '+%Y-%m-%d_%H.%M.%S')".png # Utilities: Screenshot >> clipboard & file
bindln = CTRL, Print, exec, $grimMonitor - | wl-copy
# AI (requires a running ollama model)
bind = SUPER SHIFT ALT, mouse:273, exec, $hyprScripts/ai/primary-buffer-query.sh # Utilities: Generate AI summary for selected text

##! Screen
# Zoom (via hyprland/scripts/zoom.sh: same ±0.3 step as keybinds.lua, clamped 1.0–3.0)
binde = SUPER, minus, exec, $hyprScripts/zoom.sh out # Screen: Zoom out
binde = SUPER, equal, exec, $hyprScripts/zoom.sh in # Screen: Zoom in
# Zoom with keypad
binde = SUPER, code:82, exec, $hyprScripts/zoom.sh out
binde = SUPER, code:86, exec, $hyprScripts/zoom.sh in

##! Media
bindl = SUPER SHIFT, N, exec, $mediaNext # Media: Next track
bindl = , XF86AudioNext, exec, $mediaNext
bindl = , XF86AudioPrev, exec, playerctl previous
bind = SUPER SHIFT ALT, mouse:275, exec, playerctl previous
bind = SUPER SHIFT ALT, mouse:276, exec, $mediaNext
bindl = SUPER SHIFT, B, exec, playerctl previous # Media: Previous track
bindl = SUPER SHIFT, P, exec, playerctl play-pause # Media: Play/pause media
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle
bindl = SUPER SHIFT, M, exec, wpctl set-mute @DEFAULT_SINK@ toggle # Media: Toggle mute
bindl = ALT, XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
bindl = SUPER ALT, M, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle # Media: Toggle mic

#!
##! Window
# Focusing
bindm = SUPER, mouse:272, movewindow # Window: Move
bindm = SUPER, mouse:274, movewindow
bindm = SUPER, mouse:273, resizewindow # Window: Resize
# bind = SUPER + ←/↑/→/↓,, -- Focus in direction
bind = SUPER, left, movefocus, l # Window: Focus Left
bind = SUPER, right, movefocus, r # Window: Focus Right
bind = SUPER, up, movefocus, u # Window: Focus Up
bind = SUPER, down, movefocus, d # Window: Focus Down
bind = SUPER, bracketleft, movefocus, l
bind = SUPER, bracketright, movefocus, r
# bind = SUPER + SHIFT, ←/↑/→/↓,, -- Move in direction
bind = SUPER SHIFT, left, movewindow, l # Window: Move Left
bind = SUPER SHIFT, right, movewindow, r # Window: Move Right
bind = SUPER SHIFT, up, movewindow, u # Window: Move Up
bind = SUPER SHIFT, down, movewindow, d # Window: Move Down

bindn = ALT, F4, exec, notify-send "Wrong close keybind" "Super+Q to close. Use Alt+F4 for Windows VMs" -a Hyprland
bind = SUPER, Q, killactive, # Window: Close
bind = SUPER SHIFT ALT, Q, exec, hyprctl kill # Window: Forcefully zap a window

# Window split ratio
# binde = SUPER, ;/',, -- Adjust split ratio
binde = SUPER, semicolon, layoutmsg, splitratio -0.1
binde = SUPER, apostrophe, layoutmsg, splitratio +0.1
# Positioning mode
bind = SUPER ALT, space, togglefloating, # Window: Float/Tile
bind = SUPER, D, fullscreen, 1 # Window: Maximize
bind = SUPER, F, fullscreen, 0 # Window: Fullscreen
bind = SUPER ALT, F, fullscreenstate, 0 3 # Window: Fullscreen spoof
bind = SUPER, P, pin, # Window: Pin

# bind = SUPER+ALT, Hash,, -- Send to workspace -- (1, 2, 3,...)
bind = SUPER ALT, 1, movetoworkspace, 1 # Window: Send to workspace 1
bind = SUPER ALT, 2, movetoworkspace, 2 # Window: Send to workspace 2
bind = SUPER ALT, 3, movetoworkspace, 3 # Window: Send to workspace 3
bind = SUPER ALT, 4, movetoworkspace, 4 # Window: Send to workspace 4
bind = SUPER ALT, 5, movetoworkspace, 5 # Window: Send to workspace 5
bind = SUPER ALT, 6, movetoworkspace, 6 # Window: Send to workspace 6
bind = SUPER ALT, 7, movetoworkspace, 7 # Window: Send to workspace 7
bind = SUPER ALT, 8, movetoworkspace, 8 # Window: Send to workspace 8
bind = SUPER ALT, 9, movetoworkspace, 9 # Window: Send to workspace 9
bind = SUPER ALT, 0, movetoworkspace, 10 # Window: Send to workspace 10
# We also use raw keycodes because some keyboard layouts register number keys as different chars. The codes can be verified with `wev`
# keypad numbers
bind = SUPER ALT, code:87, movetoworkspace, 1
bind = SUPER ALT, code:88, movetoworkspace, 2
bind = SUPER ALT, code:89, movetoworkspace, 3
bind = SUPER ALT, code:83, movetoworkspace, 4
bind = SUPER ALT, code:84, movetoworkspace, 5
bind = SUPER ALT, code:85, movetoworkspace, 6
bind = SUPER ALT, code:79, movetoworkspace, 7
bind = SUPER ALT, code:80, movetoworkspace, 8
bind = SUPER ALT, code:81, movetoworkspace, 9
bind = SUPER ALT, code:90, movetoworkspace, 10

# bind = SUPER+SHIFT, Scroll ↑/↓,, -- Send to workspace left/right
bind = SUPER SHIFT, mouse:down, movetoworkspace, r-1
bind = SUPER SHIFT, mouse:up, movetoworkspace, r+1
bind = SUPER ALT, mouse:down, movetoworkspace, r-1
bind = SUPER ALT, mouse:up, movetoworkspace, r+1

# bind = SUPER+SHIFT, Page_↑/↓,, -- Send to workspace left/right
bind = SUPER SHIFT, Page_Up, movetoworkspace, r-1 # Window: Send to workspace left
bind = SUPER SHIFT, Page_Down, movetoworkspace, r+1 # Window: Send to workspace right
bind = SUPER ALT, Page_Down, movetoworkspace, r+1 # [hidden]
bind = SUPER ALT, Page_Up, movetoworkspace, r-1 # [hidden]
bind = CTRL SUPER SHIFT, Right, movetoworkspace, r+1 # [hidden]
bind = CTRL SUPER SHIFT, Left, movetoworkspace, r-1 # [hidden]

bind = SUPER ALT, S, movetoworkspace, special:special # Window: Send to scratchpad
bind = CTRL SUPER, S, togglespecialworkspace, special

##! Workspace
# Switching
# bind = SUPER, Hash,, -- Focus workspace -- (1, 2, 3,...)
bind = SUPER, 1, workspace, 1 # Workspace: Focus 1
bind = SUPER, 2, workspace, 2 # Workspace: Focus 2
bind = SUPER, 3, workspace, 3 # Workspace: Focus 3
bind = SUPER, 4, workspace, 4 # Workspace: Focus 4
bind = SUPER, 5, workspace, 5 # Workspace: Focus 5
bind = SUPER, 6, workspace, 6 # Workspace: Focus 6
bind = SUPER, 7, workspace, 7 # Workspace: Focus 7
bind = SUPER, 8, workspace, 8 # Workspace: Focus 8
bind = SUPER, 9, workspace, 9 # Workspace: Focus 9
bind = SUPER, 0, workspace, 10 # Workspace: Focus 10
# We also use raw keycodes because some keyboard layouts register number keys as different chars. The codes can be verified with `wev`
bind = SUPER, code:10, workspace, 1
bind = SUPER, code:11, workspace, 2
bind = SUPER, code:12, workspace, 3
bind = SUPER, code:13, workspace, 4
bind = SUPER, code:14, workspace, 5
bind = SUPER, code:15, workspace, 6
bind = SUPER, code:16, workspace, 7
bind = SUPER, code:17, workspace, 8
bind = SUPER, code:18, workspace, 9
bind = SUPER, code:19, workspace, 10
# keypad numbers
bind = SUPER, code:87, workspace, 1
bind = SUPER, code:88, workspace, 2
bind = SUPER, code:89, workspace, 3
bind = SUPER, code:83, workspace, 4
bind = SUPER, code:84, workspace, 5
bind = SUPER, code:85, workspace, 6
bind = SUPER, code:79, workspace, 7
bind = SUPER, code:80, workspace, 8
bind = SUPER, code:81, workspace, 9
bind = SUPER, code:90, workspace, 10

# bind = CTRL+SUPER, ←/→,, -- Focus left/right
bind = CTRL SUPER, left, workspace, r-1 # Workspace: Focus left
bind = CTRL SUPER, right, workspace, r+1 # Workspace: Focus right
# bind = CTRL+SUPER+ALT, ←/→,, -- # [hidden] Focus busy left/right
bind = CTRL SUPER ALT, left, workspace, m-1 # [hidden]
bind = CTRL SUPER ALT, right, workspace, m+1 # [hidden]
# bind = SUPER, Page_↑/↓,, -- Focus left/right
bind = SUPER, Page_Down, workspace, r+1
bind = SUPER, Page_Up, workspace, r-1
bind = CTRL SUPER, Page_Down, workspace, r+1
bind = CTRL SUPER, Page_Up, workspace, r-1
# bind = SUPER, Scroll ↑/↓,, -- Focus left/right
bind = SUPER, mouse_up, workspace, +1
bind = SUPER, mouse_down, workspace, -1
bind = CTRL SUPER, mouse_up, workspace, r+1
bind = CTRL SUPER, mouse_down, workspace, r-1
## Special
bind = SUPER, S, togglespecialworkspace, special # Workspace: Toggle scratchpad
bind = SUPER, mouse:275, togglespecialworkspace, special
bind = CTRL SUPER, bracketleft, workspace, -1
bind = CTRL SUPER, bracketright, workspace, +1
bind = CTRL SUPER, up, workspace, r-5
bind = CTRL SUPER, down, workspace, r+5

##! Virtual machines
# Entering disables every bind except the exit chord below (mirrors the
# virtual-machine submap in keybinds.lua).
bind = SUPER ALT, F1, exec, notify-send 'Entered Virtual Machine submap' 'Keybinds disabled. Hit SUPER+ALT+F1 to escape' -a 'Hyprland'
bind = SUPER ALT, F1, submap, virtual-machine
submap = virtual-machine
bind = SUPER ALT, F1, exec, notify-send 'Exited Virtual Machine submap' 'Keybinds re-enabled' -a 'Hyprland'
bind = SUPER ALT, F1, submap, reset
submap = reset


#!
# Testing (via hyprland/scripts/test-notify.sh — see header note)
bind = SUPER ALT, F11, exec, $hyprScripts/test-notify.sh body-image # [hidden]
bind = SUPER ALT, F12, exec, $hyprScripts/test-notify.sh simple # [hidden]
bind = SUPER ALT, equal, exec, notify-send 'Urgent notification' 'Ah hell no' -u critical -a 'Hyprland keybind' # [hidden]

##! Session
bind = SUPER, L, exec, loginctl lock-session # Session: Lock
bindl = SUPER SHIFT, L, exec, systemctl suspend || loginctl suspend # Session: Sleep
# bindl = , switch:on:Lid Switch, exec, systemctl suspend || loginctl suspend # [hidden] Suspend when laptop lid is closed, uncomment if for whatever reason it's not the default behavior

bind = CTRL SHIFT ALT SUPER, Delete, exec, systemctl poweroff || loginctl poweroff # Session: Shut down # [hidden] Power off


##! Apps
bind = SUPER, Return, exec, $terminal # App: Terminal
bind = SUPER, T, exec, $terminal
bind = CTRL ALT, T, exec, $terminal
bind = SUPER, E, exec, $fileManager # App: File manager
bind = SUPER, W, exec, $browser # App: Browser
bind = SUPER, C, exec, $codeEditor # App: Code editor
bind = CTRL SUPER SHIFT ALT, W, exec, $officeSoftware # App: Office software
bind = SUPER, X, exec, $textEditor # App: Text editor
bind = CTRL SUPER, V, exec, $volumeMixer # App: Volume mixer
bind = SUPER, I, global, quickshell:settingsToggle # App: Settings app
bind = CTRL SHIFT, Escape, exec, $taskManager # App: Task manager

# Cursed stuff
## Make window not amogus large
bind = CTRL SUPER, backslash, resizeactive, exact 640 480
