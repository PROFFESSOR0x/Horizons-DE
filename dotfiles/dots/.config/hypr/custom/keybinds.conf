# hyprlang noerror false
# Legacy (.conf) user keybinds for Hyprland < 0.55 — mirror of custom/keybinds.lua.
# This file is never overwritten by updates (installed once, then left alone).
# See https://wiki.hyprland.org/Configuring/Binds/
#!
##! User
bind = Ctrl+Super, Slash, exec, xdg-open ~/.config/illogical-impulse/config.json # Edit shell config
bind = Ctrl+Super+Alt, Slash, exec, xdg-open ~/.config/hypr/custom/keybinds.conf # Edit extra keybinds

# Ported from custom/keybinds.lua (kept in sync with it):
bind = SUPER, escape, global, quickshell:settingsToggle # Toggle settings
bind = SUPER, I, global, quickshell:settingsToggle # Toggle settings
# Keybinds cheat sheet overlay (shell/modules/ii/keybindsOverlay/KeybindsOverlay.qml).
# SUPER + Slash already opens it via hyprland/keybinds.conf
# (global quickshell:cheatsheetToggle) — this alternate trigger goes through
# `qs ipc call` directly instead, e.g. for scripting or a different chord.
bind = SUPER SHIFT, slash, exec, qs -c $qsConfig ipc call keybindsOverlay toggle # Shell: Toggle keybinds cheat sheet (ipc)

# Local machine customization (preserved):
bind = SUPER, F12, exec, ~/.config/switch_hypr_profile.sh

# Add stuff here
# Use #! to add an extra column on the cheatsheet
# Use ##! to add a section in that column
# Add a comment after a bind to add a description, like above
