# Horizons for i3/X11
#
# This file is safe to include from ~/.config/i3/config. The installer creates
# it and adds the include only after asking. Keep personal i3 bindings in the
# main config; this file contains only Horizons-owned integration.
#
# Ported from dotfiles/dots/.config/hypr/hyprland/{general,keybinds,rules}.lua
# — see docs/i3-quickshell-research.md for the full equivalence table this
# was built from and what could NOT be ported (window-move/resize animation,
# blur/shadow/rounding on regular app windows, per-monitor HiDPI scale — all
# real X11/i3 limitations, not gaps in this file).
#
# NOTE: if your i3 config (or the distro default it was seeded from) still has
# its own `bar { ... }` block, you'll get a second, redundant status bar at
# the screen edge underneath/above Quickshell's own bar — Quickshell is not
# aware of and does not touch i3's native bar. Comment that block out in your
# main config if you don't want both. installer.sh's i3 step warns about this
# when it detects one.

# ── Startup ───────────────────────────────────────────────────────────────
# Run one shell per i3 session. Do not use `exec` here: i3's exec_always keeps
# the shell alive across an i3 config reload without starting duplicates.
exec_always --no-startup-id sh -lc 'pgrep -x quickshell >/dev/null || quickshell -c horizons'

# ── Look: gaps / borders / colors ────────────────────────────────────────
# Mirrors general.lua's general.gaps_in/gaps_out/border_size and
# general.col.active_border/inactive_border. i3 has supported native gaps
# since 4.22 (the i3-gaps fork was merged upstream) so no separate patched
# build is needed. Alpha channel in Hyprland's rgba() colors has no i3
# equivalent (i3 window borders are opaque X11 pixels) so both colors below
# are the same hue with alpha dropped.
gaps inner 4
gaps outer 5
smart_gaps on

default_border pixel 1
default_floating_border pixel 1
# No titlebar text/background is meaningfully visible with a 1px border and
# this shell providing its own bar/window-title surfaces, but i3 still wants
# 5 colors per class: border, background, text, indicator, child_border.
client.focused          #0DB7D4 #141318 #E6E1E1 #0DB7D4 #0DB7D4
client.focused_inactive #313136 #141318 #948F94 #313136 #313136
client.unfocused        #313136 #141318 #948F94 #313136 #313136
client.urgent           #FFB4AB #141318 #690005 #FFB4AB #FFB4AB

floating_modifier $mod

# ── Apps ──────────────────────────────────────────────────────────────────
# Same "try these in order, run whichever exists" launcher Hyprland's
# variables.lua uses, duplicated WM-agnostically at
# shell/scripts/apps/launch_first_available.sh (see that file's header for
# why) since the Hyprland-dotfiles copy under ~/.config/hypr is never
# installed for an i3-only target.
# i3's $variable substitution is a single non-recursive pass (per i3's own
# FAQ/community docs) — a variable's value referencing ANOTHER $variable is
# not expanded, it's kept as the literal two-character text "$name". Every
# `set` below is therefore written out in full rather than composed from a
# shared prefix variable, even though that means repeating the same path a
# few times.
set $launch $HOME/.config/quickshell/horizons/scripts/apps/launch_first_available.sh
set $term exec --no-startup-id $launch "kitty -1" "foot" "alacritty" "wezterm" "konsole" "kgx" "uxterm" "xterm"
set $fileManager exec --no-startup-id $launch "dolphin" "nautilus" "nemo" "thunar" "xterm -e fish -c yazi"
set $browser exec --no-startup-id $launch "firefox" "google-chrome-stable" "zen-browser" "brave" "chromium" "microsoft-edge-stable" "opera" "librewolf"
set $codeEditor exec --no-startup-id $launch "windsurf" "antigravity" "code" "codium" "cursor" "zed" "zedit" "zeditor" "kate" "gnome-text-editor" "emacs"
set $textEditor exec --no-startup-id $launch "kate" "gnome-text-editor" "emacs"
set $volumeMixer exec --no-startup-id $launch "pavucontrol-qt" "pavucontrol"
set $taskManager exec --no-startup-id $launch "gnome-system-monitor" "command -v btop && xterm -e btop"

bindsym $mod+Return $term
bindsym $mod+t $term
bindsym ctrl+alt+t $term
bindsym $mod+e $fileManager
bindsym $mod+w $browser
bindsym $mod+c $codeEditor
bindsym $mod+x $textEditor
bindsym ctrl+$mod+v $volumeMixer
bindsym ctrl+shift+Escape $taskManager

# ── Shell: IPC toggles (quickshell ipc -c horizons call <target> <fn>) ─────
# These reach the exact same code path as Hyprland's hl.dsp.global(
# "quickshell:X") binds — the shell exposes every one of these as an
# IpcHandler already; only Wayland's portal-based GlobalShortcut mechanism
# (Hyprland-only, see shell/services/CompositorGlobalShortcut.qml) doesn't
# apply on i3, so bindsym+exec IS the native, direct path here instead of a
# workaround.
#
# keybinds.lua's own `qsIsAlive || rawFallback` idiom needs a *separate*
# aliveness probe (TEST_ALIVE) on Hyprland only because hl.dsp.global()
# doesn't return a shell exit code to chain `||` off of — it's a second,
# independent bind layered on the same key. A plain `exec` here already has
# a real exit code, so the equivalent i3 idiom is simpler and more direct:
# call the *real* function first and let ITS failure (quickshell not
# running) trigger the fallback — no separate TEST_ALIVE probe needed, and
# no risk of the probe's own target name silently swallowing the actual
# toggle the way a naive `$qsIsAlive <target> <fn>` concatenation would.
set $qsIpc quickshell ipc -c horizons call

bindsym $mod+i exec --no-startup-id $qsIpc settings toggle
bindsym $mod+Escape exec --no-startup-id $qsIpc settings toggle
bindsym $mod+d exec --no-startup-id $qsIpc search toggle
bindsym $mod+v exec --no-startup-id sh -c '$qsIpc search clipboardToggle || pkill fuzzel || cliphist list | fuzzel --match-mode fzf --dmenu | cliphist decode | wl-copy'
bindsym $mod+period exec --no-startup-id sh -c '$qsIpc search emojiToggle || pkill fuzzel || fuzzel'
bindsym $mod+a exec --no-startup-id $qsIpc sidebarLeft toggle
bindsym $mod+b exec --no-startup-id $qsIpc sidebarLeft toggle
bindsym $mod+o exec --no-startup-id $qsIpc sidebarLeft toggle
bindsym $mod+n exec --no-startup-id $qsIpc sidebarRight toggle
bindsym $mod+slash exec --no-startup-id $qsIpc keybindsOverlay toggle
bindsym $mod+k exec --no-startup-id $qsIpc osk toggle
bindsym $mod+m exec --no-startup-id $qsIpc mediaControls toggle
bindsym $mod+g exec --no-startup-id $qsIpc overlay toggle
bindsym ctrl+alt+Delete exec --no-startup-id $qsIpc session toggle
bindsym $mod+j exec --no-startup-id $qsIpc bar toggle
bindsym ctrl+$mod+t exec --no-startup-id $qsIpc wallpaperSelector toggle
bindsym ctrl+$mod+alt+t exec --no-startup-id $qsIpc wallpaperSelector random
bindsym ctrl+$mod+shift+d exec --no-startup-id $qsIpc background toggleCenteredWallpaper
bindsym ctrl+$mod+r exec --no-startup-id sh -c 'pkill quickshell; quickshell -c horizons &'
# Alt+Tab: i3 has no single "cycle to next window" dispatcher the way
# Hyprland's hl.dsp.window.cycle_next() does — reusing the shell's own
# window switcher (same UI as Super+Tab) is more robust than a hand-rolled
# i3-msg get_tree/focus script for a one-line binding.
bindsym $mod+Tab exec --no-startup-id $qsIpc windowSwitcher toggle
bindsym alt+Tab exec --no-startup-id $qsIpc windowSwitcher toggle

# Screenshot / OCR / recording / translate — the shell's own region tools,
# same as Hyprland's regionScreenshot/regionSearch/regionOcr/regionRecord.
bindsym $mod+shift+s exec --no-startup-id $qsIpc region screenshot
bindsym $mod+shift+a exec --no-startup-id $qsIpc region search
bindsym $mod+shift+x exec --no-startup-id $qsIpc region ocr
bindsym $mod+shift+t exec --no-startup-id $qsIpc screenTranslator translate
bindsym $mod+shift+r exec --no-startup-id $qsIpc region record
bindsym $mod+alt+r exec --no-startup-id $qsIpc region record
bindsym $mod+shift+alt+r exec --no-startup-id $qsIpc region recordWithSound
bindsym Print exec --no-startup-id sh -c 'import -window root png:- | xclip -selection clipboard -t image/png'
bindsym ctrl+Print exec --no-startup-id sh -c 'mkdir -p $(xdg-user-dir PICTURES)/Screenshots && import -window root "$(xdg-user-dir PICTURES)/Screenshots/Screenshot_$(date +%Y-%m-%d_%H.%M.%S).png"'
bindsym shift+$mod+c exec --no-startup-id sh -c 'command -v hyprpicker >/dev/null && hyprpicker -a || xcolor -s clipboard'

# ── Media / brightness / volume ──────────────────────────────────────────
# Not compositor-specific at all — same wpctl/playerctl/brightnessctl
# commands keybinds.lua already uses on Hyprland.
bindsym XF86MonBrightnessUp exec --no-startup-id sh -c '$qsIpc brightness increment || brightnessctl s 5%+'
bindsym XF86MonBrightnessDown exec --no-startup-id sh -c '$qsIpc brightness decrement || brightnessctl s 5%-'
bindsym XF86AudioRaiseVolume exec --no-startup-id wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+ -l 1.5
bindsym XF86AudioLowerVolume exec --no-startup-id wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bindsym XF86AudioMute exec --no-startup-id wpctl set-mute @DEFAULT_SINK@ toggle
bindsym $mod+shift+m exec --no-startup-id wpctl set-mute @DEFAULT_SINK@ toggle
bindsym XF86AudioMicMute exec --no-startup-id wpctl set-mute @DEFAULT_SOURCE@ toggle
bindsym $mod+alt+m exec --no-startup-id wpctl set-mute @DEFAULT_SOURCE@ toggle
bindsym XF86AudioNext exec --no-startup-id playerctl next
bindsym XF86AudioPrev exec --no-startup-id playerctl previous
bindsym XF86AudioPlay exec --no-startup-id playerctl play-pause
bindsym XF86AudioPause exec --no-startup-id playerctl play-pause
bindsym $mod+shift+n exec --no-startup-id playerctl next
bindsym $mod+shift+b exec --no-startup-id playerctl previous
bindsym $mod+shift+p exec --no-startup-id playerctl play-pause

# ── Window management (native i3, no IPC needed) ───────────────────────────
bindsym $mod+q kill
bindsym $mod+alt+space floating toggle
bindsym $mod+f fullscreen toggle
bindsym $mod+p sticky toggle

bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down
bindsym $mod+shift+Left move left
bindsym $mod+shift+Right move right
bindsym $mod+shift+Up move up
bindsym $mod+shift+Down move down

bindsym $mod+semicolon split h
bindsym $mod+apostrophe split v
bindsym $mod+r mode "resize"

# Self-contained: this is i3's own standard default-config idiom, redefined
# here (not assumed to already exist) so $mod+r works correctly whether this
# file is included from the distro-default template configure_i3() seeds, or
# from a fully custom pre-existing i3 config that never had one.
mode "resize" {
    bindsym Left  resize shrink width 10 px
    bindsym Down  resize grow height 10 px
    bindsym Up    resize shrink height 10 px
    bindsym Right resize grow width 10 px
    bindsym Escape mode "default"
    bindsym Return mode "default"
}

# ── Workspaces ──────────────────────────────────────────────────────────
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

bindsym $mod+alt+1 move container to workspace number 1
bindsym $mod+alt+2 move container to workspace number 2
bindsym $mod+alt+3 move container to workspace number 3
bindsym $mod+alt+4 move container to workspace number 4
bindsym $mod+alt+5 move container to workspace number 5
bindsym $mod+alt+6 move container to workspace number 6
bindsym $mod+alt+7 move container to workspace number 7
bindsym $mod+alt+8 move container to workspace number 8
bindsym $mod+alt+9 move container to workspace number 9
bindsym $mod+alt+0 move container to workspace number 10

bindsym ctrl+$mod+Left workspace prev_on_output
bindsym ctrl+$mod+Right workspace next_on_output
bindsym $mod+alt+s move scratchpad
bindsym ctrl+$mod+s scratchpad show

# ── Session ───────────────────────────────────────────────────────────────
bindsym $mod+l exec --no-startup-id loginctl lock-session
bindsym $mod+shift+l exec --no-startup-id sh -c 'systemctl suspend || loginctl suspend'
bindsym ctrl+shift+alt+$mod+Delete exec --no-startup-id sh -c 'systemctl poweroff || loginctl poweroff'

# ── Submap: virtual machine (disable keybinds while a VM has focus) ───────
# i3's `mode` is the direct equivalent of Hyprland's hl.define_submap() —
# same notify-send-on-enter/exit UX as keybinds.lua's own submap, so it's
# just as discoverable that keybinds are (or aren't) currently intercepted.
# Chaining `exec ...` with a second i3 command (`mode ...`) via i3's comma
# command-separator is ambiguous — i3's own FAQ says an exec's shell command
# swallows everything up to end of line, not just up to the comma — so both
# steps run from inside one `sh -c`, using i3-msg for the second command,
# instead of relying on bindsym-level chaining.
bindsym $mod+alt+F1 exec --no-startup-id sh -c 'notify-send "Entered Virtual Machine mode" "Keybinds disabled. Hit Super+Alt+F1 to exit" -a i3; i3-msg mode virtual-machine'
mode "virtual-machine" {
    bindsym $mod+alt+F1 exec --no-startup-id sh -c 'notify-send "Exited Virtual Machine mode" "Keybinds re-enabled" -a i3; i3-msg mode default'
}

# ── Window rules (for_window ⇄ rules.lua's hl.window_rule) ────────────────
for_window [title="^(Open File)(.*)$"]                     floating enable
for_window [title="^(Select a File)(.*)$"]                 floating enable
for_window [title="^(Choose wallpaper)(.*)$"]               floating enable
for_window [title="^(Open Folder)(.*)$"]                    floating enable
for_window [title="^(Save As)(.*)$"]                        floating enable
for_window [title="^(Library)(.*)$"]                        floating enable
for_window [title="^(File Upload)(.*)$"]                    floating enable
for_window [title="(.*)(wants to save)$"]                   floating enable
for_window [title="(.*)(wants to open)$"]                   floating enable
for_window [class="^(?i)(blueberry\.py)$"]                  floating enable
for_window [class="^(?i)(pavucontrol)(-qt)?$"]               floating enable
for_window [class="^(?i)(org\.pulseaudio\.pavucontrol)$"]    floating enable
for_window [class="^(?i)(nm-connection-editor)$"]            floating enable
for_window [title="illogical-impulse Settings"]              floating enable
for_window [title="(?i)picture[-\s]?in[-\s]?picture(.*)"]    floating enable, sticky enable, move position center
# (Hyprland's PiP rule also pins it to a fixed 73%/72%-of-screen corner via
# monitor_w/monitor_h expressions i3 has no equivalent for — "move position"
# only takes absolute pixels or "center", and a hardcoded pixel offset would
# put the window off-screen on a smaller/different-resolution monitor, so
# this settles for centered + floating + sticky instead of guessing a corner.)
for_window [title="(.*)is sharing (a window|your screen)(.*)"] floating enable, sticky enable

# ── Optional: picom for blur/shadow/rounded corners on regular windows ────
# i3 itself is not a compositor and has no equivalent of Hyprland's
# decoration.rounding/blur/shadow — those apply compositor-side to every
# window on Hyprland, and there is no way to replicate that from i3 config
# alone. This block is only meaningful if picom is installed AND the
# installer's i3 step (installer.sh's configure_i3) offered and you accepted
# it; it's a no-op harmless line otherwise since exec_always+pgrep is a
# guarded no-op when the binary is missing.
exec_always --no-startup-id sh -lc 'command -v picom >/dev/null && { pgrep -x picom >/dev/null || picom --config ~/.config/picom/horizons.conf -b; }'
