# Horizons — optional picom config for i3/X11
#
# i3 itself has no compositor, so unlike Hyprland's decoration.rounding/
# blur/shadow (general.lua — applied compositor-side to every window) there
# is nothing built into i3/Quickshell that can round corners, blur, or
# shadow *other applications'* windows. picom is the standard, widely-used
# X11 compositor that fills this gap; i3/horizons.conf's own exec_always
# only launches it when it's actually installed (see that file's last line).
#
# Quickshell's own panels (bar, sidebars, popups, …) already render their
# own rounding/blur/shadow client-side via QML — this file is only about
# making *regular application windows* (browser, editor, …) look
# consistent with them, not a requirement for the shell itself to work.
#
# Values below are chosen to approximate general.lua's defaults
# (rounding=18, blur size=10/passes=3, shadow range=20/offset -0,2) within
# what picom's own settings actually mean — the two aren't a 1:1 mapping
# (Hyprland's blur "size"/"passes" and picom's blur "strength" measure
# different things), so treat this as a reasonable starting point to tune,
# not an exact port.

backend = "glx";
vsync = true;

# ── Corners ─────────────────────────────────────────────────────────────
corner-radius = 18;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
];

# ── Blur ────────────────────────────────────────────────────────────────
blur: {
    method = "dual_kawase";
    strength = 5;
};
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
];

# ── Shadows ─────────────────────────────────────────────────────────────
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.35;
shadow-offset-x = 0;
shadow-offset-y = 2;
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'notification'",   # Quickshell renders its own notification shadow
];

# ── Fading (i3 has no window-move/resize animation either way — this only
# softens open/close, the one motion picom itself can add) ────────────────
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# ── Misc ────────────────────────────────────────────────────────────────
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
